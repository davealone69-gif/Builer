name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Create Gradle Wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          echo "Gradle wrapper missing — generating with 9.3.1..."
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
        else
          chmod +x gradlew
        fi

    - name: Inject API keys from GitHub Secrets (optional)
      run: |
        # Creates a local .env from secrets so the secrets-gradle-plugin can pick them up.
        # Add secrets in: Settings → Secrets and variables → Actions
        # Supported: GEMINI_API_KEY, HUGGINGFACE_TOKEN, GROQ_API_KEY
        touch .env
        if [ -n "$GEMINI_API_KEY" ]; then
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
        fi
        if [ -n "$HUGGINGFACE_TOKEN" ]; then
          echo "HUGGINGFACE_TOKEN=$HUGGINGFACE_TOKEN" >> .env
          echo "HF_TOKEN=$HUGGINGFACE_TOKEN" >> .env
        fi
        if [ -n "$GROQ_API_KEY" ]; then
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
        fi
        echo ".env ready"
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: builder-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
